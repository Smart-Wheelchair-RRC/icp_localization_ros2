/icp_localization:
  ros__parameters:
    pcd_file_path: "/home/container_user/wheelchair2/src/wheelchair2_navigation/maps/rrc/lab_map_with_outside_corridor.pcd"
    # pcd_file_path: "/home/container_user/wheelchair2/src/wheelchair2_navigation/maps/ramps/rrc_outside_himalaya_ramps.pcd"
    # pcd_file_path: "/home/container_user/wheelchair2/src/wheelchair2_navigation/maps/himalaya/with_classroom/himalaya_with_classroom_ICP.pcd"
    input_filters_config_path: "config/input_filteres_mid360.yaml"
    
    icp_localization_ros2:
      range_data_topic: "/livox/lidar"
      num_accumulated_range_data: 1
      imu_data_topic: "/livox/imu"
      odometry_data_topic: "/Odometry"
      is_use_odometry: true
      is_provide_odom_frame: false
      gravity_vector_filter_time_constant: 0.01
      fixed_frame: "map"
      min_num_odom_msgs_before_ready: 5

    initial_pose:
      x: 0.0 
      y: 0.0 
      z: 0.0 
      roll: 0.0  # degrees  
      pitch: 0.0 # degrees
      yaw: 0.0  # degrees

    calibration:
      imu_to_range_sensor:
        x: -0.011
        y: -0.0234
        z: 0.044
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

    odometry_source_to_range_sensor:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0 
